# Sample agentic adjusting journal — Sprint A2 Wind Tunnel fixture.
#
# Purpose: provide a realistic, human-readable, schema-locked example of
# a depreciation tax-adjustment journal authored by the Depreciation_Transforms
# calculator (lodgeit-depreciation-transforms/0.x). The ClawDog Wind Tunnel
# can load this file via engine.yaml_adjustments.load_adjustment_yaml() and
# inject the resulting facts into sbrm_consolidation:sbrm_adjustment/6 for
# local Prolog-engine testing without any HTTP round-trip.
#
# Journal SHAPE (A4.3 ruling 2026-05-04 02:59 UTC, Brain canon mc08):
# This is the 3-line CUMULATIVE TRANSITION journal that
# process_resurrection_batch/4 natively emits:
#
#   line(<X> (At Cost),        debit,  original_cost)
#   line(<X> (Acc Dep),        credit, accumulated_tax_dep)
#   line(Retained Earnings,    credit, book_to_tax_variance)
#
# It recognises a book-to-tax variance at a single transition date.
# Andrew's ruling: 'Forcing handle_resurrect to synthesize a period-flow
# just to match a spec illustration is a textbook Standing Rule #3
# violation. We do not invent derived values to satisfy a fixture; we
# ground the fixture in the reality of the calculator.'
#
# Concept-mapping (verified against Kit live ontology at commit 5167e066d569…):
#   <X> (At Cost)           -> mini_PropertyPlantAndEquipmentGross    (debit)
#   <X> (Acc Dep)           -> audit_AccumulatedTaxDepreciation       (credit)
#   Retained Earnings       -> mini_RetainedEarnings                  (credit)
#
# The journal balances by construction (10000 debit = 3750 + 6250 credit = 10000).
#
# Brain canon: GLOBAL_NOTES/CLAWDOG/108_LAST_MILE_ARCHITECTURE.md § 4.2.2 + § 4.4.1
