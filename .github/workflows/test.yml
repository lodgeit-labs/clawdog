name: Kit Test Gates

# Two-gate CI for the public ClawDog Kit (lodgeit-labs/clawdog).
#
# Per `clawdog-brain` Standing Rule #7 (Repository Topology) the Kit is an
# Egress Interface: direct-to-`main` is authorised for additive-isolated
# work and PR-mode is required for critical-path mutations to `pipeline.py`
# or `engine/`. Either way, both gates below must pass before merge:
#
#   Gate 1 — Prolog regression suite. Proves engine/consolidation.pl and any
#            future engine/*.pl modules did not regress against their own
#            test fixtures. Required because the engine is the source of
#            truth for SBRM consolidation semantics.
#
#   Gate 2 — Pipeline integration. Proves the full Python+Prolog pipeline
#            (pipeline.py + heuristic_mapper + ixbrl_template) still passes
#            the 7-point thermodynamic audit across all sample ledgers,
#            including multi-currency consolidation. Required because the
#            pipeline is what users actually run.
#
# These gates surface as inline status checks above the GitHub merge button.

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  prolog-regression:
    name: Gate 1 — Prolog regression (engine/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox
          swipl --version

      - name: Run engine/tests/test_consolidation.pl
        run: |
          set -e
          swipl -g run_tests -t halt engine/tests/test_consolidation.pl

      - name: Run engine/tests/test_audit.pl
        run: |
          set -e
          swipl -g run_tests -t halt engine/tests/test_audit.pl

      - name: Set up Python (for engine.jurisdiction_periods unittests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run engine/tests/test_jurisdiction_periods.py (S5c)
        run: |
          set -e
          # Stdlib unittest only — no new test-framework dependency.
          # The engine.jurisdiction_periods module is pure Python with
          # zero third-party imports, so this runs without installing
          # requirements.txt. Per Lesson #29: every Kit gate verifies
          # what it claims to gate, and Gate 1 owns engine/* regression.
          python3 -m unittest engine.tests.test_jurisdiction_periods -v

  pipeline-integration:
    name: Gate 2 — Pipeline integration (7-point audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SWI-Prolog (with libswipl for pyswip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog
          swipl --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline.py against all sample ledgers
        run: |
          set -e
          # S5b: clear stale outputs first so a renamed/removed sample
          # ledger does not leave a stale .html behind that would fail the
          # context-count assertion below.
          rm -rf outputs
          python3 pipeline.py | tee pipeline.log
          # Pipeline returns exit code 0 even when audit fails; we have to
          # parse the summary line to fail the job on any aborted ledger.
          if grep -E "^ PIPELINE COMPLETE \| .* \| ❌ 0 Aborted" pipeline.log >/dev/null; then
            echo "✅ All ledgers passed the 7-point audit."
          else
            echo "❌ One or more ledgers failed the 7-point audit. See pipeline.log above."
            exit 1
          fi

      - name: Confirm iXBRL artifacts rendered
        run: |
          set -e
          ls -la outputs/ || (echo "❌ outputs/ directory missing" && exit 1)
          test -f outputs/AcmeGroup_consolidated.html \
            || (echo "❌ AcmeGroup iXBRL did not render" && exit 1)
          # Translation Note section must appear in the multi-currency group
          # output (regression guard for S4).
          if grep -q "Translation Note" outputs/AcmeGroup_consolidated.html; then
            echo "✅ Translation Note section present in AcmeGroup iXBRL."
          else
            echo "❌ Translation Note section missing in AcmeGroup iXBRL."
            exit 1
          fi
          # Translation Note must NOT appear in single-currency outputs.
          for f in outputs/GL_01_*.html outputs/GL_02_*.html outputs/GL_05_Sydney_Cafe_Co_Pty_Ltd_FY25.html outputs/Input_A.html; do
            if [ -f "$f" ] && grep -q "Translation Note" "$f"; then
              echo "❌ Translation Note leaked into single-currency output: $f"
              exit 1
            fi
          done
          echo "✅ Translation Note correctly scoped to multi-currency groups."

      - name: Assert iXBRL comparative-period contexts (S5b)
        run: |
          set -e
          # S5b: outputs that carry a comparative period MUST emit exactly
          # 4 distinct xbrli:context blocks (instant + duration; current +
          # prior). Single-period outputs MUST emit exactly 2 (instant +
          # duration). Catches accidental duplication, accidental omission,
          # or stale comparative contexts leaking into single-period output.
          python3 - <<'PY'
          import sys, glob
          import xml.etree.ElementTree as ET
          NS_XBRLI = '{http://www.xbrl.org/2003/instance}'
          # Files that MUST carry comparatives (have a sibling _FY24 ledger
          # or a manifest comparative block).
          comparative_outputs = {
              'outputs/GL_05_Sydney_Cafe_Co_Pty_Ltd_FY25.html',
              'outputs/AcmeGroup_consolidated.html',
          }
          fails = []
          for path in sorted(glob.glob('outputs/*.html')):
              tree = ET.parse(path)
              ctxs = sorted(c.get('id') for c in tree.iter(NS_XBRLI + 'context'))
              if path in comparative_outputs:
                  expected = ['ctx-duration', 'ctx-duration-prior',
                              'ctx-instant',  'ctx-instant-prior']
                  if ctxs != expected:
                      fails.append((path, expected, ctxs))
                      print(f'❌ {path}: expected {expected}, got {ctxs}')
                      continue
                  print(f'✅ {path}: comparative contexts present ({len(ctxs)})')
              else:
                  expected = ['ctx-duration', 'ctx-instant']
                  if ctxs != expected:
                      fails.append((path, expected, ctxs))
                      print(f'❌ {path}: expected {expected}, got {ctxs}')
                      continue
                  print(f'✅ {path}: single-period contexts ({len(ctxs)})')
          if fails:
              print()
              print(f'{len(fails)} iXBRL artifact(s) failed S5b context-count assertion.')
              sys.exit(1)
          PY

      - name: Assert iXBRL output is XML well-formed
        run: |
          set -e
          # iXBRL is XHTML and MUST parse as XML. Unescaped specials
          # (& < > in text nodes, unquoted attribute values, etc.) make
          # the output unprocessable by HMRC/ATO XBRL ingest pipelines
          # downstream of the Kit. Catching this in CI is cheap and
          # exactly the kind of structural regression the gate exists
          # for. Assert every rendered .html parses cleanly via stdlib
          # ElementTree.
          python3 - <<'PY'
          import sys, glob
          import xml.etree.ElementTree as ET
          fails = []
          for path in sorted(glob.glob('outputs/*.html')):
              try:
                  ET.parse(path)
                  print(f'✅ {path}: well-formed XML')
              except ET.ParseError as e:
                  fails.append((path, str(e)))
                  print(f'❌ {path}: {e}')
          if fails:
              print()
              print(f'{len(fails)} iXBRL artifact(s) failed XML well-formedness:')
              for p, e in fails:
                  print(f'  {p}: {e}')
              sys.exit(1)
          print()
          print(f'✅ All {len(glob.glob("outputs/*.html"))} iXBRL artifacts are XML well-formed.')
          PY
